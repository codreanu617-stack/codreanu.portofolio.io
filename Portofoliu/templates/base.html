<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Codreanu Rareș – Portfolio{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- Custom cursor -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Scroll progress bar -->
  <div id="scroll-bar"></div>

  <!-- Lightbox -->
  <div id="lightbox">
    <span id="lightbox-close">&#10005;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <!-- NAVBAR -->
  <header class="top-nav">
    <div class="logo-area">
      <img src="/static/images/logo.jpg" class="logo-img" alt="Logo">
      <div class="logo-text-block">
        <span class="logo-name">Codreanu Rareș</span>
        <span class="logo-tag">JUST ASH | Graphic Designer</span>
      </div>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="nav-links">
      <a href="/#hero">Acasă</a>
      <a href="/#about">Despre</a>
      <a href="/#tools">Tools</a>
      <a href="/#artfolio">Artfolio</a>
      <a href="/#experience">Experiență</a>
      <a href="/#education">Educație</a>
      <a href="/#contact">Contact</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  {% block content %}{% endblock %}

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Codreanu Rareș &mdash; All rights reserved</p>
    <p class="footer-accent">Just Ash &middot; Graphic Designer</p>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    /* --- Custom Cursor --- */
    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mouseX = 0, mouseY = 0;
    let ringX  = 0, ringY  = 0;

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.left = mouseX + 'px';
      dot.style.top  = mouseY + 'px';
    });

    (function animateRing() {
      ringX += (mouseX - ringX) * 0.12;
      ringY += (mouseY - ringY) * 0.12;
      ring.style.left = ringX + 'px';
      ring.style.top  = ringY + 'px';
      requestAnimationFrame(animateRing);
    })();

    document.querySelectorAll('a, button, .art-card, .tool-card, .stat-card, .contact-item').forEach(function(el) {
      el.addEventListener('mouseenter', function() { document.body.classList.add('cursor-hover'); });
      el.addEventListener('mouseleave', function() { document.body.classList.remove('cursor-hover'); });
    });

    /* --- Scroll Progress --- */
    var scrollBar = document.getElementById('scroll-bar');
    window.addEventListener('scroll', function() {
      var pct = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
      scrollBar.style.width = pct + '%';
    });

    /* --- IntersectionObserver --- */
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(function(el) {
      observer.observe(el);
    });

    /* --- Hamburger Menu --- */
    var hamburger = document.getElementById('hamburger');
    var navLinks  = document.getElementById('nav-links');

    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      navLinks.classList.toggle('open');
    });

    navLinks.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        hamburger.classList.remove('open');
        navLinks.classList.remove('open');
      });
    });

    /* --- Lightbox --- */
    var lightbox = document.getElementById('lightbox');
    var lbImg    = document.getElementById('lightbox-img');
    var lbClose  = document.getElementById('lightbox-close');

    document.querySelectorAll('.art-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var src = card.getAttribute('data-src');
        if (!src) return;
        lbImg.src = src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
